{% extends "layout.html" %}

{% block title %}
My Profile
{% endblock %}

{% block content %}

<div class="container">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow border-0">

                <div class="card-body p-5">

                    <div class="text-center">

                        <!-- Profile Image -->
                        <img
                            src="{{ url_for('static', filename=user[2] if user[2] else 'images/avatar.png') }}"
                            class="rounded-circle shadow mb-3 profile-img"
                            width="150"
                            height="150"
                            alt="Profile Picture">

                        <!-- Upload Profile Picture -->
                        <form action="{{ url_for('upload_profile') }}"
                              method="POST"
                              enctype="multipart/form-data"
                              class="mt-3">

                            <input
                                type="file"
                                name="profile"
                                class="form-control"
                                accept=".jpg,.jpeg,.png"
                                required>

                            <button
                                type="submit"
                                class="btn btn-primary mt-3">

                                <i class="bi bi-camera-fill"></i>
                                Upload Profile Picture

                            </button>

                        </form>

                        <h2 class="mt-4">{{ user[0] }}</h2>

                        <p class="text-muted">
                            Student | SkillHub User
                        </p>

                    </div>

                    <hr>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <h6 class="text-muted">
                                Full Name
                            </h6>

                            <p class="fw-bold">
                                {{ user[0] }}
                            </p>

                        </div>

                        <div class="col-md-6 mb-3">

                            <h6 class="text-muted">
                                Email
                            </h6>

                            <p class="fw-bold">
                                {{ user[1] }}
                            </p>

                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <h6 class="text-muted">
                                Role
                            </h6>

                            <p class="fw-bold">
                                Student
                            </p>

                        </div>

                        <div class="col-md-6 mb-3">

                            <h6 class="text-muted">
                                Account Status
                            </h6>

                            <span class="badge bg-success">
                                Active
                            </span>

                        </div>

                    </div>

                    <div class="mt-4 d-flex justify-content-between">

                        <a href="{{ url_for('dashboard') }}"
                           class="btn btn-secondary">

                            ← Dashboard

                        </a>

                        <a href="{{ url_for('settings') }}"
                           class="btn btn-primary">

                            ⚙ Settings

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
