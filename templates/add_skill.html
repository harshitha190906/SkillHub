{% extends "layout.html" %}

{% block title %}
Add Skill
{% endblock %}

{% block content %}

<div class="container">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow p-4">

                <h2 class="mb-4 text-center">
                    ➕ Add New Skill
                </h2>

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Skill Name
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            name="skill_name"
                            placeholder="Enter Skill Name"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Skill Level
                        </label>

                        <select
                            class="form-select"
                            name="skill_level"
                            required>

                            <option value="">Select Skill Level</option>
                            <option value="Beginner">Beginner</option>
                            <option value="Intermediate">Intermediate</option>
                            <option value="Advanced">Advanced</option>

                        </select>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea
                            class="form-control"
                            name="description"
                            rows="4"
                            placeholder="Describe your skill..."></textarea>

                    </div>

                    <div class="d-flex justify-content-between">

                        <button
                            type="submit"
                            class="btn btn-success">

                            💾 Save Skill

                        </button>

                        <a
                            href="{{ url_for('skills.view_skills') }}"
                            class="btn btn-secondary">

                            ❌ Cancel

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
